postgres-config {
  n-threads = 32
  url = "jdbc:postgresql://postgres-rw.postgres.svc.cluster.local:5432/notes_db_scala"
  user = "admin"
  user = ${?DB_USER}
  pass = ${DB_PASS}
}

ember-config {
  host = "0.0.0.0"
  port = 5002
}

redis-config {
  host = "redis-s-hl.redis.svc.cluster.local"
  port = 26379
  pass = ${REDIS_PASS}
  master-set = "mymaster"
}

# 맨 아래에 로컬 설정 파일 불러오기 추가
include "application.local.conf"
