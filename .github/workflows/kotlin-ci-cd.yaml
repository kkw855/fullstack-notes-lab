name: Kotlin API CI/CD Pipeline

on:
  workflow_dispatch: # 💡 수동 실행(Run workflow 버튼) 트리거 허용
  push:
    branches:
      - 'main'
    paths:
      - 'custom-kotlin-api/**' # 💡 중요: 코틀린 프로젝트 폴더 내부가 변경될 때만 독립적으로 실행됨
  pull_request:
    branches:
      - 'main'
    paths:
      - 'custom-kotlin-api/**'

jobs:
  build-and-push:
    runs-on: arc-runner-set-lab
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle' # 💡 핵심: Gradle 의존성 캐시를 유지해 속도를 끌어올립니다.

      - name: Run Gradle Tests
        run: ./gradlew test --no-daemon
        working-directory: ./custom-kotlin-api

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1️⃣ 코틀린 API 애플리케이션 도커 이미지 빌드 (로컬 Docker daemon 로드)
      - name: Build Kotlin API Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./custom-kotlin-api
          file: ./custom-kotlin-api/Dockerfile
          load: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/custom-kotlin-api:latest
            ghcr.io/${{ github.repository_owner }}/custom-kotlin-api:${{ github.sha }}

      # 2️⃣ Trivy 이미지 취약점 검사
      - name: Run Trivy vulnerability scanner on Kotlin API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/custom-kotlin-api:${{ github.sha }}'
          format: 'table'
          exit-code: '1' # 💡 취약점 발견 시 워크플로우를 중단하려면 '1'로 변경하세요.
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      # 3️⃣ 코틀린 API 애플리케이션 도커 이미지 푸시
      - name: Push Kotlin API Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./custom-kotlin-api
          file: ./custom-kotlin-api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/custom-kotlin-api:latest
            ghcr.io/${{ github.repository_owner }}/custom-kotlin-api:${{ github.sha }}

      # 4️⃣ [수정 단계] GitOps 저장소 업데이트 (deployment 이미지 태그 패치)
      # 💡 Flyway는 Spring Boot 앱 시작 시 자동으로 마이그레이션을 실행하므로,
      #    scala 쪽과 달리 별도의 migration Job/이미지가 필요 없습니다.
      - name: Update GitOps repository
        shell: bash
        env:
          GIT_TOKEN: ${{ secrets.GITOPS_PAT }}
        run: |
          git config --global credential.helper store
          echo "https://${GIT_TOKEN}:x-oauth-basic@github.com" > ~/.git-credentials

          rm -rf gitops

          git clone https://github.com/kkw855/fullstack-notes-kotlin-gitops.git gitops
          cd gitops

          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i '' "s|image: ghcr.io/${{ github.repository_owner }}/custom-kotlin-api:.*|image: ghcr.io/${{ github.repository_owner }}/custom-kotlin-api:${{ github.sha }}|g" deployment.yaml
          else
            sed -i "s|image: ghcr.io/${{ github.repository_owner }}/custom-kotlin-api:.*|image: ghcr.io/${{ github.repository_owner }}/custom-kotlin-api:${{ github.sha }}|g" deployment.yaml
          fi

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add deployment.yaml
          git commit -m "Update Kotlin API image to ${{ github.sha }}"
          git push -f https://${GIT_TOKEN}@github.com/kkw855/fullstack-notes-kotlin-gitops.git main
